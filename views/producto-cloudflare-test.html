<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>[TEST] Producto Mardant · Cloudflare D1</title>
  <meta name="description" content="Prueba aislada del detalle de producto Mardant usando Cloudflare D1.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/estilos.css?v=17">
  <link rel="stylesheet" href="../css/producto.css?v=11">
</head>
<body>
  <div style="position:sticky;top:0;z-index:99999;background:#111;color:#fff;padding:8px 12px;text-align:center;font:700 13px Arial,sans-serif;border-bottom:2px solid #f48120">🧪 TEST CLOUDFLARE D1 · DETALLE DE PRODUCTO · NO ES PRODUCCIÓN</div>

  <div class="pdp-wrap">
    <div class="pdp-top">
      <a class="pdp-back" href="./catalogo-cloudflare-test.html">← Volver al catálogo TEST</a>
    </div>

    <div id="pdp-error" class="pdp-error" style="display:none;"></div>
    <div id="pdp" class="pdp" style="display:none;">
      <div class="pdp-grid">
        <div class="pdp-media"><img id="pdp-img" class="pdp-img" alt=""></div>
        <div class="pdp-info">
          <div class="pdp-badges">
            <span id="pdp-estado" class="pdp-badge"></span>
            <span id="pdp-id" class="pdp-badge pdp-badge-muted"></span>
          </div>
          <h1 id="pdp-nombre" class="pdp-title"></h1>
          <div id="pdp-precio" class="pdp-precio"></div>
          <div class="pdp-actions">
            <button id="pdp-add" class="boton">🛒 Añadir al carrito</button>
            <button id="pdp-copy" class="boton pdp-btn-sec">🔗 Copiar link</button>
            <a id="pdp-wa" class="boton pdp-btn-wa" href="#" target="_blank" rel="noopener noreferrer">💬 Pedir por WhatsApp</a>
          </div>
          <div class="pdp-meta">
            <div><strong>Categoría:</strong> <span id="pdp-cat">-</span></div>
            <div><strong>Subcategoría:</strong> <span id="pdp-sub">-</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <a class="boton-carrito-flotante" href="./carrito.html" aria-label="Ir al carrito">🛒 <span id="contador-carrito" class="contador-carrito"></span></a>
  <div id="mini-carrito" class="mini-carrito"></div>

  <script type="module" src="../js/producto-cloudflare-test.js?v=4"></script>
