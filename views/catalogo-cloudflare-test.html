<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>[TEST] Catálogo Mardant · Cloudflare D1</title>
</head>
<body>
  <p style="font-family:Arial,sans-serif;padding:20px">Cargando catálogo de prueba...</p>

  <script>
    (async () => {
      try {
        const response = await fetch('./catalogo.html?cf-test-shell=' + Date.now(), { cache:'no-store' });
        if (!response.ok) throw new Error('No se pudo cargar catalogo.html');

        let html = await response.text();

        html = html.replace(
          /<script\s+type=["']module["']\s+src=["']\.\.\/js\/catalogo\.js\?v=16["']><\/script>/i,
          '<script type="module" src="../js/catalogo-cloudflare-test.js?v=1"><\/script>'
        );

        html = html.replace(
          /<head>/i,
          '<head>\n<meta name="robots" content="noindex,nofollow">\n<title>[TEST] Catálogo Mardant · Cloudflare D1</title>'
        );

        html = html.replace(
          /<body([^>]*)>/i,
          `<body$1>\n<div style="position:sticky;top:0;z-index:99999;background:#111;color:#fff;padding:8px 12px;text-align:center;font:700 13px Arial,sans-serif;border-bottom:2px solid #f48120">🧪 TEST CLOUDFLARE D1 · CATÁLOGO CORE · 1,358 productos · NO ES PRODUCCIÓN</div>`
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = `<pre style="padding:20px;font-family:monospace">Error cargando la prueba: ${String(error?.message || error)}</pre>`;
      }
    })();
  </script>
</body>
</html>
