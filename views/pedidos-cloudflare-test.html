<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow">
  <title>[TEST] Productos a pedido · Cloudflare D1</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/estilos.css?v=18" />
  <style>
    html, body { overflow-x: hidden; }
    :root{ --pill-radius:9999px; --card-max-mobile:380px; }
    .test-bar{position:sticky;top:0;z-index:99999;background:#111;color:#fff;padding:8px 12px;text-align:center;font:700 13px Arial,sans-serif;border-bottom:2px solid #f48120}
    .cta-pedidos{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:12px auto 20px;padding:0 12px;background:none!important;box-shadow:none!important;border:0!important;border-radius:0!important;position:relative}
    .cta-pedidos::before,.cta-pedidos::after{content:none!important}
    .btn-pill{display:inline-flex;align-items:center;gap:10px;color:#fff;font-weight:800;line-height:1;padding:14px 22px;border-radius:var(--pill-radius);text-decoration:none;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0)),#a8322a;box-shadow:0 10px 24px rgba(168,50,42,.22)}
    .btn-pill.alt{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0)),#171411}
    .btn-pill.japan{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0)),#6f2b26;border:1px solid rgba(244,208,111,.28)}
    .titulo-seccion{color:#171411}.titulo-seccion::after{background:#a8322a}
    .pedido-order-panel{width:min(420px,calc(100% - 32px));box-sizing:border-box;margin:0 auto 24px;padding:13px 15px;border:1px solid #d8c6aa;border-left:5px solid #a8322a;border-radius:8px;background:linear-gradient(90deg,rgba(168,50,42,.045),rgba(255,255,255,.72)),#fffaf2;box-shadow:0 10px 24px rgba(44,34,25,.08)}
    .pedido-order-field{display:grid;gap:7px;min-width:0;margin:0}.pedido-order-field span{color:#6f5b49;font-size:12px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase}.pedido-order-field select{width:100%;min-height:42px;box-sizing:border-box;border:1px solid #d8c6aa;border-radius:8px;background:#fffaf2;color:#171411;font:inherit;font-weight:900;padding:8px 12px;outline:none}
    .paginacion{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:10px auto 40px;padding:0 16px}.paginacion button{min-width:32px;padding:6px 10px;border-radius:999px;border:1px solid #a8322a;background:#a8322a;color:#fff;font-size:14px;cursor:pointer}.paginacion button:disabled{opacity:.4;cursor:default}.paginacion button.activa{background:#171411;border-color:#171411;font-weight:700}
    .grid-pedidos{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:28px;max-width:1200px;margin:0 auto 60px;padding:0 16px;box-sizing:border-box}.grid-pedidos .producto{width:100%;padding-bottom:22px}.grid-pedidos .producto img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;object-fit:contain!important;border-radius:10px;cursor:zoom-in}.boton-cotizar{display:block;margin-top:10px;margin-bottom:6px;text-align:center;font-weight:900;letter-spacing:.04em;background:linear-gradient(180deg,#263b37,#162421);border:1px solid rgba(216,198,170,.34);color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.22)}
    @media(max-width:1100px){.grid-pedidos{grid-template-columns:repeat(2,minmax(260px,1fr))}}@media(max-width:720px){.grid-pedidos{grid-template-columns:1fr;gap:18px}.grid-pedidos .producto{max-width:var(--card-max-mobile);margin:0 auto}.cta-pedidos{margin-bottom:22px;gap:10px}}
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:10000;padding:16px}.lightbox[hidden]{display:none!important}.lightbox img{max-width:94vw;max-height:88vh;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.5)}.lb-close{position:absolute;top:10px;right:14px;background:transparent;border:none;color:#fff;font-size:36px;line-height:1;cursor:pointer}
  </style>
</head>
<body>
  <div class="test-bar">🧪 TEST CLOUDFLARE D1 · PRODUCTOS A PEDIDO · 1,845 productos · NO ES PRODUCCIÓN</div>
  <h1 class="sr-only">Productos a pedido Mardant Perú desde Japón</h1>

  <img src="https://i.imgur.com/dcPrIuh.png" alt="Productos a Pedido" style="width:100%;max-height:200px;object-fit:cover;border-bottom:3px solid #a8322a;" referrerpolicy="no-referrer" />

  <div class="contacto-centro"><h2 class="titulo-seccion">Productos a Pedido</h2></div>

  <div class="cta-pedidos">
    <a href="./pedidos.html" class="btn-pill">↩️ <span>Volver a pedidos real</span></a>
    <a href="catalogo-cloudflare-test.html" class="btn-pill alt">🛍️ <span>Catálogo TEST</span></a>
    <a href="catalogo-japon-cloudflare-test.html" class="btn-pill japan"><span>日本</span><span>Japón TEST</span></a>
  </div>

  <section class="pedido-order-panel" aria-label="Orden de productos">
    <label class="pedido-order-field" for="pedidoOrdenSelect">
      <span>Ordenar</span>
      <select id="pedidoOrdenSelect"><option value="newest">&Uacute;ltimos a&ntilde;adidos</option><option value="oldest">M&aacute;s antiguos</option></select>
    </label>
  </section>

  <div class="grid-pedidos" id="contenedor"><p style="text-align:center;width:100%;">Cargando productos desde Cloudflare D1…</p></div>
  <div id="paginacion" class="paginacion catalog-pagination" aria-label="Paginas de productos a pedido"></div>

  <a href="carrito.html" class="boton-carrito-flotante" title="Ver carrito 🛒">🛒</a>

  <div id="lb" class="lightbox" hidden><img alt="Vista ampliada"><button class="lb-close" aria-label="Cerrar">×</button></div>

  <script type="module" src="../js/pedidos-cloudflare-test.js?v=1"></script>

  <script>
    (()=>{const cont=document.getElementById('contenedor');const lb=document.getElementById('lb');const img=lb.querySelector('img');cont.addEventListener('click',e=>{const el=e.target;if(el&&el.tagName==='IMG'){img.src=el.src;lb.hidden=false;document.body.style.overflow='hidden';}});const close=()=>{lb.hidden=true;img.src='';document.body.style.overflow='';};lb.addEventListener('click',close);lb.querySelector('.lb-close').addEventListener('click',ev=>{ev.stopPropagation();close();});document.addEventListener('keydown',ev=>{if(!lb.hidden&&ev.key==='Escape')close();});})();
  </script>
</body>
</html>
